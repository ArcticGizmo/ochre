name: CI

# Builds everything and runs the tests on every pull request (and by hand on any branch), so a red build is caught
# before it merges rather than at release time.

on:
  pull_request:
  workflow_dispatch:

# Read-only: nothing here writes to the repo. Every action is pinned to a commit SHA, with its version in the
# trailing comment.
permissions:
  contents: read

# A newer push to the same pull request replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Enable pnpm
        working-directory: ui
        run: corepack enable

      # Before the .NET build, which copies ui/dist into the host's output.
      - name: UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build
        run: dotnet build Ochre.slnx -c Release

      # ui/src/generated/bridge-types.ts must match the bridge records (ADR 0009).
      - name: Bridge types are current
        run: dotnet run --project tools/Ochre.BridgeGen -- --check

      - name: Test
        run: dotnet test tests/Ochre.Tests/Ochre.Tests.csproj -c Release --no-build --blame-hang-timeout 10m
