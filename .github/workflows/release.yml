name: Release

# Pushing a tag such as v0.2.0 builds Ochre with publish.ps1 and publishes a GitHub release with the installer, the
# Velopack update feed an installed Ochre reads, and SHA256SUMS.txt, which install.ps1 checks the installer against
# (ADR 0014).

on:
  push:
    tags:
      - 'v*'

# Read-only by default: only the final job, which builds nothing, may write (to create the release). Every action is
# pinned to a commit SHA, with its version in the trailing comment.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK comes from global.json, so CI builds with the same SDK as a local build.
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # corepack runs the pnpm pinned in ui/package.json (packageManager); ui/.npmrc keeps install scripts off.
      - name: Enable pnpm
        working-directory: ui
        run: corepack enable

      - name: Test
        run: dotnet test tests/Ochre.Tests/Ochre.Tests.csproj -c Release --blame-hang-timeout 10m

      # windows-latest has the C++ build tools, so the CLI is NativeAOT here.
      - name: Build and pack
        shell: pwsh
        run: ./publish.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: releases/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: dist

      # SHA256SUMS.txt must describe exactly the bytes being published, so it's made again here from them.
      - name: Checksums
        run: |
          set -euo pipefail
          rm -f dist/SHA256SUMS.txt
          if [ ! -f dist/OchreApp-win-Setup.exe ]; then
            echo "::error::OchreApp-win-Setup.exe is missing; install.ps1 depends on it."
            exit 1
          fi
          ( cd dist && LC_ALL=C sha256sum -- * > ../SHA256SUMS.txt )
          mv SHA256SUMS.txt dist/SHA256SUMS.txt
          {
            echo '### Published files'
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          # A tag with a suffix (v0.2.0-beta.1) is a prerelease, which the app's update check skips.
          prerelease: ${{ contains(github.ref_name, '-') }}
