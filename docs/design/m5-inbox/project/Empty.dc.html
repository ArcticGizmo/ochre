<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox, empty</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#1b1a19}
a{color:#e8974a}a:hover{color:#f0aa66}
.app{min-height:100vh;background:#1b1a19;color:#e8e4df;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;padding:8px 16px;border-bottom:1px solid #3a3836}
.brand{font-weight:600;color:#e8974a}
.tag{font-size:11px;padding:1px 6px;border:1px solid #3a3836;border-radius:4px;color:#a39d96}
.nav{color:#a39d96;text-decoration:none;padding:5px 12px;border-radius:6px;display:inline-flex;align-items:center;gap:6px}
.nav:hover{color:#e8e4df;background:#242322}
.nav.on{color:#e8e4df;background:#2e2c2a}
.nav-count{font-size:12px;color:#a39d96}
.muted{color:#a39d96}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid;white-space:nowrap;background:none;font-family:inherit;cursor:pointer}
.f-all{color:#e8e4df;border-color:#5c5854;background:#2e2c2a}
.f-need{color:#d9b44a;border-color:rgba(217,180,74,.45);background:rgba(217,180,74,.08)}
.f-done{color:#86b572;border-color:rgba(134,181,114,.4);background:rgba(134,181,114,.08)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;display:inline-block}
.empty{border:1px dashed #3a3836;border-radius:10px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
</style>
</helmet>
<div class="app">
  <header class="bar">
    <span class="brand">Ochre</span>
    <span class="tag">DEV</span>
    <nav style="display: flex; gap: 4px; margin-left: 8px; flex-wrap: wrap" aria-label="Main">
      <a href="#today" class="nav">Today</a>
      <a href="#tasks" class="nav">Tasks</a>
      <a href="Main.dc.html" class="nav on" aria-current="page">Inbox</a>
      <a href="#terminals" class="nav">Terminals <span class="nav-count">2</span></a>
      <a href="#git" class="nav">Git</a>
    </nav>
    <span style="flex: 1"></span>
    <span class="muted" style="font-size: 12px">v0.1.0</span>
  </header>
  <main style="max-width: 880px; margin: 0 auto; padding: 28px 24px 56px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 4px">
      <div style="flex: 1; min-width: 240px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600">Inbox</h1>
        <div class="muted" style="margin-top: 2px">What your agents are waiting on, by task.</div>
      </div>
      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap" role="group" aria-label="Show">
        <button class="pill f-all" type="button" aria-pressed="true">All 0</button>
        <button class="pill f-need" type="button" aria-pressed="false"><span class="dot"></span>Needs you 0</button>
        <button class="pill f-done" type="button" aria-pressed="false"><span class="dot"></span>Finished 0</button>
      </div>
    </div>
    <div class="empty">
      <div style="font-size: 16px; font-weight: 600">Nothing needs you</div>
      <div class="muted" style="max-width: 460px">Permission prompts, questions, plans and finished turns from your agents show up here, grouped by task.</div>
    </div>
  </main>
</div>
</x-dc>
